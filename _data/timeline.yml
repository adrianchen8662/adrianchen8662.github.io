# The timeline on the home page.
#
# Add an entry anywhere in this list; the page sorts everything from the present
# back into the past, and groups jobs at the same organization the way LinkedIn does.
#
#   kind:          work, education, project or certification
#   title:         job title, degree, project or certification name
#   organization:  employer, school or issuer
#   start, end:    YYYY-MM, or just YYYY. Leave out end while it's still going on, or give
#                  the expected finish; it shows as "(expected)" until that month has passed.
#                  For a certification, start is when it was issued; use expires instead of end.
#   type, location, workplace, description, skills, link, image: optional
#                  (image: src is a path relative to this file, plus alt text describing it)

