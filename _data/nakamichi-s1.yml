# Nakamichi S-1A / S-1B: everything the exploded view is drawn from.
#
# One file per object. The exploded view (and later any cross-section or spec table)
# reads this, so correcting a number here corrects every picture of it.
#
# Conventions
#   Units:   millimetres.
#   Space:   x runs left to right, y runs bottom to top, z runs front to back, with the speaker
#            upright and z = 0 at the front of the grille. x = 0, y = 0 is the middle of the housing.
#   Photographed pair: S-1B, seen from the front, so the port is on the viewer's left.
#
# Every number in `dims` carries a status, and the status is the point of this file:
#   measured   read with calipers or a ruler on the real part
#   estimated  scaled from a photo (the ruler shots and the known housing size set the scale)
#   assumed    a placeholder so the part can be drawn at all; go and measure it
# A value written as a formula takes the weakest status of the dims it uses.
# `grep -n "status: assumed" _data/nakamichi-s1.yml` lists what is left to measure.

object:
  name: Nakamichi S-1A / S-1B
  # z of the cabinet's front edge. Parts that start inside the cabinet and come out of its front are
  # drawn in front of it once they are out, and behind its walls while they are still in.
  front_plane: grille_sheet

dims:
  # ---- measured ----
  cabinet_w:      { label: Housing width,  value: 138.82, status: measured }
  cabinet_h:      { label: Housing height, value: 224.44, status: measured }
  overall_depth:  { label: Housing depth,  value: 226.49, status: measured, note: "Front of the grille to the rear edge of the housing; the rear panel's protrusion is not included" }
  grille_w:       { label: Grille width,   value: 138.01, status: measured, note: "Face of the grille, from the front" }
  grille_h:       { label: Grille height,  value: 211.33, status: measured, note: "Face of the grille, from the front" }
  tab_depth:      { label: Flange and tab depth, value: 10.94, status: measured, note: "Given as the grille tab size; flanges and tabs are the same depth. Confirm this reading is the depth." }
  tweeter_frame_d:      { label: Tweeter frame diameter,        value: 52,    status: measured }
  tweeter_ear_span:     { label: Tweeter width across the ears, value: 74,    status: measured }
  tweeter_hole_d:       { label: Tweeter hole in the baffle,    value: 48,    status: measured }
  tweeter_slot_spacing: { label: Tweeter slot spacing,          value: 65.06, status: measured }
  tweeter_slot_w:       { label: Tweeter slot length,           value: 5.48,  status: measured }
  tweeter_slot_h:       { label: Tweeter slot width,            value: 3.94,  status: measured }
  tweeter_ear_len:      { label: Tweeter ear length beyond the frame, value: tweeter_ear_span / 2 - tweeter_frame_d / 2 }
  tweeter_ear_mid:      { label: Tweeter ear centre from the frame's centre, value: tweeter_frame_d / 2 + tweeter_ear_len / 2 }
  tweeter_slot_off:     { label: Tweeter slot from the ear's centre, value: tweeter_slot_spacing / 2 - tweeter_ear_mid }

  # ---- estimated from the photos ----
  wall:           { label: Cabinet wall thickness, value: 6.5, status: estimated, note: "The rim around the rear panel in the ruler photo is about 6.8 mm. A baffle that fits inside walls this thick is 211.44 mm tall, within 0.1 mm of the grille height (211.33), which supports it." }
  screw_x:        { label: Baffle screw x from centre, value: 53.5, status: estimated }
  screw_y:        { label: Baffle screw y from centre, value: 97,   status: estimated }
  screw_head_d:   { label: Baffle screw head diameter, value: 5.7,  status: estimated }
  tweeter_y:      { label: Tweeter centre height,      value: 68.6, status: estimated, note: "Centred left to right" }
  port_x:         { label: Port centre x from centre,  value: -40.7, status: estimated, note: "Negative is the viewer's left. This is the S-1B; the S-1A is presumably a mirror image." }
  port_y:         { label: Port centre height,         value: 40.3, status: estimated }
  port_hole_d:    { label: Port opening in the baffle, value: 37,   status: estimated }
  port_tube_od:   { label: Port tube outer diameter,   value: 36,   status: estimated }
  port_bore_d:    { label: Port tube inner diameter,   value: 29,   status: estimated }
  woofer_y:       { label: Woofer centre height,       value: -39,  status: estimated, note: "Centred left to right" }
  woofer_hole_d:  { label: Woofer hole in the baffle,  value: 104,  status: estimated, note: "Narrowest point. The hole is bevelled out to about 125 mm at the front; the bevel is not modelled yet." }
  tab_width:      { label: Grille tab width,           value: 43,   status: estimated, note: "Two tabs, centred on the top and bottom edges" }
  badge_w:        { label: Badge width,                value: 9,    status: measured, note: "Calipers" }
  badge_h:        { label: Badge height,               value: 4,    status: measured, note: "Calipers" }
  badge_t:        { label: Badge height above the grille, value: 1, status: estimated, note: "The badge stands slightly proud of the grille; about a millimetre is a guess" }
  badge_recess:   { label: Badge black piece sunk below the gold, value: 0.4, status: assumed, note: "The black piece is a separate part set a little lower than the gold" }
  grille_pitch:   { label: Grille hole pitch, value: 1.38, status: estimated, note: "Centre to centre, scaled from a close-up photo against the badge's measured 9 mm width. The holes are square with rounded corners and go right through." }
  grille_hole:    { label: Grille hole size,  value: 0.92, status: estimated }
  badge_x:        { label: Badge x from centre,        value: 56.8, status: estimated, note: "Upper right when upright, about 7 mm in from the grille's right edge" }
  badge_y:        { label: Badge y from centre,        value: 95.6, status: estimated, note: "About 7.5 mm below the grille's top edge" }
  plate_size:     { label: Terminal plate size,        value: 54,   status: estimated, note: "Square, four screws, pebbled black plastic" }
  plate_screw_inset: { label: Terminal plate screw inset from the corner, value: 5, status: estimated }
  bump_d:         { label: Terminal plate bump diameter, value: 45, status: estimated, note: "The round dished recess on the outside is the back of a tapered bump that passes through the rear panel into the box" }
  clip_x:         { label: Terminal clip x from centre, value: 11, status: estimated, note: "Seen from the back, black (minus) is on the left and red (plus) on the right; x here is as seen from the front, so the signs look swapped" }
  clip_dy:        { label: Terminal clip below the plate's centre, value: 6, status: estimated }
  label_w:        { label: Rear label width,  value: 60, status: estimated }
  label_h:        { label: Rear label height, value: 33, status: estimated }
  label_y:        { label: Rear label centre height, value: -65, status: estimated, note: "Centred left to right, below the terminal plate" }
  tweeter_gasket_d:      { label: Tweeter gasket outer diameter, value: 62, status: estimated, note: "Flat white foam ring, doubled at the factory" }
  tweeter_gasket_hole_d: { label: Tweeter gasket inner diameter, value: 44, status: estimated }
  tweeter_magnet_d:      { label: Tweeter magnet cup diameter,   value: 32, status: estimated }
  plate_y:        { label: Terminal plate centre height, value: 11.2, status: estimated, note: "Centred left to right and a little above the middle of the back" }

  # ---- assumed placeholders ----
  grille_sheet:   { label: Grille sheet thickness, value: 0.8, status: assumed }
  flange_inset:   { label: Flange inset from the grille's edge, value: 3, status: assumed, note: "The flanges sit inside slots on the front, so they stand back from the edge of the face" }
  flange_len:     { label: Flange length,          value: 190,  status: assumed }
  tab_inset:      { label: Tab inset from the grille's edge, value: 3.25, status: assumed }
  baffle_t:       { label: Baffle thickness,       value: 12,   status: assumed }
  woofer_frame:   { label: Woofer frame width,     value: 115,  status: assumed, note: "Square frame. Earlier notes say about 4.5 in." }
  woofer_flange_t:     { label: Woofer frame flange thickness, value: 3,  status: assumed }
  woofer_cone_d:       { label: Woofer cone diameter,          value: 100, status: assumed }
  woofer_basket_d:     { label: Woofer basket front diameter,  value: 96,  status: assumed }
  woofer_taper:        { label: Woofer basket, back diameter as a share of the front, value: 0.75, status: assumed, note: "The basket is a cone-shaped dish with large windows" }
  woofer_basket_depth: { label: Woofer basket depth,           value: 38,  status: assumed }
  woofer_magnet_d:     { label: Woofer magnet diameter,        value: 72,  status: assumed }
  woofer_magnet_depth: { label: Woofer magnet depth,           value: 24,  status: assumed }
  woofer_dustcap_d:    { label: Woofer dust cap diameter,      value: 34,  status: assumed }
  tweeter_depth:       { label: Tweeter depth behind the flange, value: 22, status: assumed }
  tweeter_cone_d:      { label: Tweeter cone diameter,         value: 46,  status: assumed }
  tweeter_ear_w:       { label: Tweeter ear width,             value: 10,  status: assumed }
  tweeter_ear_t:       { label: Tweeter flange and ear thickness, value: 2, status: assumed }
  tweeter_magnet_depth: { label: Tweeter magnet cup depth,     value: 8,   status: assumed }
  tweeter_gasket_t:    { label: Tweeter gasket thickness (both layers), value: 3, status: assumed }
  tweeter_taper:       { label: Tweeter frame, back diameter as a share of the front, value: 0.7, status: assumed, note: "The frame is a cone-shaped dish" }
  tweeter_screw_d:     { label: Tweeter ear screw head diameter, value: 5.5, status: assumed }
  tweeter_dustcap_d:   { label: Tweeter dust cap diameter,     value: 18,  status: assumed }
  port_length:    { label: Port tube length,       value: 70,   status: assumed }
  port_recess:    { label: Port tube set back from the baffle face, value: 3, status: assumed }
  screw_len:      { label: Baffle screw length,    value: 20,   status: assumed, note: "Where they thread into is unknown; no cleats are drawn" }
  screw_shank_d:  { label: Baffle screw shank diameter, value: 3.5, status: assumed }
  screw_head_h:   { label: Baffle screw head height, value: 2.5, status: assumed }
  rear_panel_t:   { label: Rear panel thickness,   value: 6,    status: assumed }
  rear_protrusion: { label: Rear panel protrusion past the housing, value: 2, status: assumed }
  bump_depth:     { label: Terminal plate bump depth behind the plate's face, value: 28, status: assumed, note: "Through the rear panel and about 20 mm into the box" }
  panel_hole_d:   { label: Rear panel opening for the bump, value: bump_d + 3, status: assumed }
  clip_w:         { label: Terminal clip width,  value: 12, status: assumed }
  clip_h:         { label: Terminal clip height, value: 18, status: assumed }
  clip_t:         { label: Terminal clip depth,  value: 5,  status: assumed }
  felt_w:         { label: Damping felt width,     value: inner_w - 6, status: estimated, note: "Covers basically the entire back wall; the margin is a guess" }
  felt_h:         { label: Damping felt height,    value: inner_h - 6, status: estimated, note: "Grey recycled-fibre felt with coloured threads" }
  felt_t:         { label: Damping felt thickness, value: 8,    status: assumed }
  felt_y:         { label: Damping felt centre height, value: 0, status: estimated }
  plate_t:        { label: Terminal plate thickness, value: 3,  status: assumed }
  cap_d:          { label: Crossover capacitor diameter, value: 10, status: assumed }
  cap_len:        { label: Crossover capacitor length,   value: 17, status: assumed, note: "Lies sideways under the bump, held on with glue; leads run to the terminal tabs" }

  # ---- worked out from the above ----
  inner_w:        { label: Cabinet inside width,  value: cabinet_w - 2 * wall }
  inner_h:        { label: Cabinet inside height, value: cabinet_h - 2 * wall }
  body_depth:     { label: Cabinet body depth,    value: overall_depth - grille_sheet }
  baffle_setback: { label: Baffle face set back from the cabinet's front edge, value: grille_sheet + tab_depth, note: "Assumed to match the depth of the grille's flanges and tabs" }
  baffle_z:       { label: Baffle face z,         value: grille_sheet + baffle_setback }
  baffle_back_z:  { label: Baffle back z,         value: baffle_z + baffle_t }
  panel_front_z:  { label: Rear panel front z,    value: overall_depth + rear_protrusion - rear_panel_t }
  plate_z:        { label: Terminal plate face z, value: overall_depth + rear_protrusion }
  zf:             { label: Tweeter flange z,      value: baffle_back_z + tweeter_gasket_t }

parts:
  # Listed back to front. `paint` sets drawing order (lower is drawn first, so further back);
  # `interior: true` parts start inside the cabinet and are hidden by its walls until they come out the front.
  # `explode` is how far the part travels at full explosion.

  - id: terminal_plate
    name: Terminal plate
    material: plate
    explode: [0, 0, 95]
    interior: true
    show: [plate_size, plate_y, bump_d, bump_depth, plate_t]
    info: Pebbled black plastic input plate. Four screws hold it to the outside of the rear panel, and a tapered round bump on its back passes through the panel into the box. Push-clip terminals (black minus, red plus) sit in the round dished recess.
    solids:
      - { outline: { circle: bump_d }, taper: 0.9, at: [0, plate_y, "plate_z - bump_depth"], depth: bump_depth, paint: 5 }
      - outline: { rect: [plate_size, plate_size] }
        at: [0, plate_y, plate_z]
        depth: plate_t
        paint: 6
        decals:
          - { circle: bump_d, at: [0, 0], material: recess, side: back }
          - { circle: 6, at: ["plate_size / 2 - plate_screw_inset", "plate_size / 2 - plate_screw_inset"], material: screw_head, side: back }
          - { circle: 6, at: ["-(plate_size / 2 - plate_screw_inset)", "plate_size / 2 - plate_screw_inset"], material: screw_head, side: back }
          - { circle: 6, at: ["plate_size / 2 - plate_screw_inset", "-(plate_size / 2 - plate_screw_inset)"], material: screw_head, side: back }
          - { circle: 6, at: ["-(plate_size / 2 - plate_screw_inset)", "-(plate_size / 2 - plate_screw_inset)"], material: screw_head, side: back }
      - { outline: { rect: [clip_w, clip_h] }, at: ["-clip_x", "plate_y - clip_dy", "plate_z + plate_t"], depth: clip_t, paint: 6.1, material: clip_red }
      - { outline: { rect: [clip_w, clip_h] }, at: ["clip_x", "plate_y - clip_dy", "plate_z + plate_t"], depth: clip_t, paint: 6.1, material: clip_black }

  - id: capacitor
    name: Crossover capacitor
    material: capacitor
    explode: [0, 0, 95]
    interior: true
    show: [cap_d, cap_len]
    info: The whole crossover. A 3.3 µF 50 V bipolar electrolytic marked Luxon, in series with the tweeter. It lies sideways under the terminal plate's bump, held on with glue, with its leads running to the terminal tabs.
    solids:
      - { outline: { circle: cap_d }, axis: x, at: ["-cap_len / 2", "plate_y - bump_d / 2 - cap_d / 2", "plate_z - bump_depth + cap_d"], depth: cap_len, paint: 22 }

  - id: rear_panel
    name: Rear panel
    material: particleboard
    explode: [0, 0, 55]
    interior: true
    show: [inner_w, inner_h, rear_panel_t, rear_protrusion, panel_hole_d]
    info: Particleboard panel set into the back of the housing, standing slightly proud of it. It carries the model label on the back and has a round opening for the terminal plate's bump.
    solids:
      - outline: { rect: [inner_w, inner_h] }
        holes: [{ circle: panel_hole_d, at: [0, plate_y] }]
        at: [0, 0, panel_front_z]
        depth: rear_panel_t
        paint: 20
        texture: chip
        decals:
          - { rect: [label_w, label_h], at: [0, label_y], material: label, side: back, lines: ["Nakamichi  Model No. S-1B", "Impedance: 8 Ohm", "Made in Taiwan R.O.C."] }

  - id: felt
    name: Damping felt
    material: felt
    explode: [0, 0, 35]
    interior: true
    show: [felt_w, felt_h, felt_t, felt_y]
    info: A pad of grey recycled-fibre felt covering basically the whole back wall, with an opening for the terminal bump.
    solids:
      - outline: { rect: [felt_w, felt_h] }
        holes: [{ circle: panel_hole_d, at: [0, plate_y] }]
        at: [0, felt_y, "panel_front_z - felt_t"]
        depth: felt_t
        paint: 21

  - id: cabinet
    name: Cabinet
    material: cabinet
    explode: [0, 0, 0]
    show: [cabinet_w, cabinet_h, overall_depth, wall, body_depth]
    info: A box with a black finish outside and smooth brown walls inside, open at the front and back. The top and bottom edges hold the grille's tabs and the side edges its flanges, in slots along the front.
    solids:
      - outline: { rect: [cabinet_w, cabinet_h] }
        holes: [{ rect: [inner_w, inner_h], at: [0, 0] }]
        at: [0, 0, grille_sheet]
        depth: body_depth
        faces: inner
        material: fiberboard
        paint: 10
      - outline: { rect: [cabinet_w, cabinet_h] }
        holes: [{ rect: [inner_w, inner_h], at: [0, 0] }]
        at: [0, 0, grille_sheet]
        depth: body_depth
        faces: outer
        paint: 40

  - id: port
    name: Port tube
    material: cardboard
    explode: [0, 0, -100]
    interior: true
    show: [port_x, port_y, port_tube_od, port_bore_d, port_length]
    info: A round cardboard tube that vents the box through the front.
    solids:
      - outline: { circle: port_tube_od }
        holes: [{ circle: port_bore_d, at: [0, 0] }]
        at: [port_x, port_y, "baffle_z + port_recess"]
        depth: port_length
        paint: 25

  - id: tweeter
    name: Tweeter
    material: zinc
    explode: [0, 0, -100]
    interior: true
    show: [tweeter_frame_d, tweeter_ear_span, tweeter_hole_d, tweeter_slot_spacing, tweeter_y, tweeter_depth, tweeter_gasket_d]
    info: A 2 in cone tweeter, 8 ohm 6 W, part number 4001286138D. A yellow-zinc stamped steel frame shaped like a shallow cone, with a silver magnet cup, and two slotted ears, one each side, that take two screws into the back of the baffle. A doubled ring of white foam seals it to the baffle.
    solids:
      - { outline: { circle: tweeter_magnet_d }, at: [0, tweeter_y, "zf + tweeter_depth"], depth: tweeter_magnet_depth, paint: 26.1, material: silver }
      - { outline: { circle: tweeter_frame_d }, taper: tweeter_taper, at: [0, tweeter_y, "zf + 4.5"], depth: "tweeter_depth - 4.5", paint: 26.2 }
      - { outline: { circle: tweeter_cone_d }, at: [0, tweeter_y, "zf + 3"], depth: 1.5, paint: 26.3, material: cone }
      - { outline: { circle: tweeter_dustcap_d }, at: [0, tweeter_y, zf], depth: 3, paint: 26.4, material: cone }
      - { outline: { circle: tweeter_frame_d }, holes: [{ circle: tweeter_cone_d, at: [0, 0] }], at: [0, tweeter_y, zf], depth: tweeter_ear_t, paint: 26.5 }
      - outline: { rect: [tweeter_ear_len, tweeter_ear_w] }
        holes: [{ rect: [tweeter_slot_w, tweeter_slot_h], at: ["tweeter_slot_off", 0] }]
        at: ["tweeter_ear_mid", tweeter_y, zf]
        depth: tweeter_ear_t
        paint: 26.5
      - outline: { rect: [tweeter_ear_len, tweeter_ear_w] }
        holes: [{ rect: [tweeter_slot_w, tweeter_slot_h], at: ["-tweeter_slot_off", 0] }]
        at: ["-tweeter_ear_mid", tweeter_y, zf]
        depth: tweeter_ear_t
        paint: 26.5
      - { outline: { circle: tweeter_screw_d }, at: ["tweeter_slot_spacing / 2", tweeter_y, "zf + tweeter_ear_t"], depth: 2, paint: 26.6, material: screw }
      - { outline: { circle: tweeter_screw_d }, at: ["-tweeter_slot_spacing / 2", tweeter_y, "zf + tweeter_ear_t"], depth: 2, paint: 26.6, material: screw }

  - id: tweeter_gasket
    name: Tweeter gasket
    material: foam
    explode: [0, 0, -55]
    interior: true
    show: [tweeter_gasket_d, tweeter_gasket_hole_d, tweeter_gasket_t]
    info: A flat ring of white foam between the tweeter's frame and the back of the baffle. The factory fitted two layers.
    solids:
      - { outline: { circle: tweeter_gasket_d }, holes: [{ circle: tweeter_gasket_hole_d, at: [0, 0] }], at: [0, tweeter_y, baffle_back_z], depth: tweeter_gasket_t, paint: 26.0 }

  - id: woofer
    name: Woofer
    material: zinc
    explode: [0, 0, -100]
    interior: true
    show: [woofer_y, woofer_frame, woofer_hole_d, woofer_cone_d, woofer_basket_depth, woofer_magnet_d]
    info: A roughly 4.5 in paper-cone woofer, 8 ohm 15 W, in a yellow-zinc stamped steel frame with a square flange and four slotted corner ears. A silver magnet cup sits at the back and a small terminal strip with two spade lugs on the frame. No gasket.
    solids:
      - { outline: { circle: woofer_magnet_d }, at: [0, woofer_y, "baffle_back_z + woofer_flange_t + 8 + woofer_basket_depth"], depth: woofer_magnet_depth, paint: 27.1, material: silver }
      - { outline: { circle: woofer_basket_d }, taper: woofer_taper, at: [0, woofer_y, "baffle_back_z + woofer_flange_t + 8"], depth: woofer_basket_depth, paint: 27.2 }
      - { outline: { circle: woofer_cone_d }, at: [0, woofer_y, "baffle_back_z + woofer_flange_t + 6"], depth: 2, paint: 27.3, material: cone }
      - { outline: { rect: [woofer_frame, woofer_frame] }, holes: [{ circle: woofer_cone_d, at: [0, 0] }], at: [0, woofer_y, baffle_back_z], depth: woofer_flange_t, paint: 27.4 }
      - { outline: { circle: woofer_dustcap_d }, at: [0, woofer_y, "baffle_back_z + woofer_flange_t"], depth: 6, paint: 27.5, material: cone }

  - id: baffle
    name: Front baffle
    material: baffle
    explode: [0, 0, -135]
    interior: true
    show: [inner_w, inner_h, baffle_t, baffle_setback, woofer_hole_d, tweeter_hole_d, port_hole_d]
    info: Black particleboard front panel with openings for the woofer, tweeter and port. Four screws at the corners hold it in.
    solids:
      - outline: { rect: [inner_w, inner_h] }
        holes:
          - { circle: tweeter_hole_d, at: [0, tweeter_y] }
          - { circle: port_hole_d, at: [port_x, port_y] }
          - { circle: woofer_hole_d, at: [0, woofer_y] }
          - { circle: 3.6, at: [screw_x, screw_y] }
          - { circle: 3.6, at: [-screw_x, screw_y] }
          - { circle: 3.6, at: [screw_x, -screw_y] }
          - { circle: 3.6, at: [-screw_x, -screw_y] }
        at: [0, 0, baffle_z]
        depth: baffle_t
        paint: 30

  - id: screws
    name: Baffle screws
    material: screw
    explode: [0, 0, -170]
    interior: true
    show: [screw_x, screw_y, screw_head_d, screw_len]
    info: Four black Phillips pan-head wood screws; some have surface rust.
    solids:
      - { outline: { circle: screw_shank_d }, at: [screw_x, screw_y, baffle_z], depth: screw_len, paint: 31 }
      - { outline: { circle: screw_head_d }, at: [screw_x, screw_y, "baffle_z - screw_head_h"], depth: screw_head_h, paint: 31.1 }
      - { outline: { circle: screw_shank_d }, at: [-screw_x, screw_y, baffle_z], depth: screw_len, paint: 31 }
      - { outline: { circle: screw_head_d }, at: [-screw_x, screw_y, "baffle_z - screw_head_h"], depth: screw_head_h, paint: 31.1 }
      - { outline: { circle: screw_shank_d }, at: [screw_x, -screw_y, baffle_z], depth: screw_len, paint: 31 }
      - { outline: { circle: screw_head_d }, at: [screw_x, -screw_y, "baffle_z - screw_head_h"], depth: screw_head_h, paint: 31.1 }
      - { outline: { circle: screw_shank_d }, at: [-screw_x, -screw_y, baffle_z], depth: screw_len, paint: 31 }
      - { outline: { circle: screw_head_d }, at: [-screw_x, -screw_y, "baffle_z - screw_head_h"], depth: screw_head_h, paint: 31.1 }

  - id: grille
    name: Grille
    material: grille
    explode: [0, 0, -210]
    show: [grille_w, grille_h, tab_depth, tab_width, grille_sheet]
    info: A pan of fine square-perforated black steel. Flanges bent back along both long edges and two tabs at the top and bottom push into slots on the front, and felt strips grip the cabinet. A small gold badge 9 x 4 mm sits at the upper right. It is a gold plate that stands about 1 mm proud of the grille, with a rounded shoulder and an arch-shaped notch. A separate solid black piece sits in the notch, a little lower than the gold.
    solids:
      - { outline: { rect: [grille_sheet, flange_len] }, at: ["grille_w / 2 - flange_inset", 0, grille_sheet], depth: tab_depth, paint: 35, interior: true }
      - { outline: { rect: [grille_sheet, flange_len] }, at: ["-(grille_w / 2 - flange_inset)", 0, grille_sheet], depth: tab_depth, paint: 35, interior: true }
      - { outline: { rect: [tab_width, grille_sheet] }, at: [0, "grille_h / 2 - tab_inset", grille_sheet], depth: tab_depth, paint: 35, interior: true }
      - { outline: { rect: [tab_width, grille_sheet] }, at: [0, "-(grille_h / 2 - tab_inset)", grille_sheet], depth: tab_depth, paint: 35, interior: true }
      - outline: { rect: [grille_w, grille_h] }
        at: [0, 0, 0]
        depth: grille_sheet
        paint: 200
        texture: mesh
        texture_pitch: grille_pitch
        texture_hole: grille_hole
        decals:
          - { rect: [badge_w, badge_h], at: [badge_x, badge_y], material: brass, art: badge, height: badge_t, recess: badge_recess }

