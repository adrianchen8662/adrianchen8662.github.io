name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  # Rebuild every hour, which refreshes the ListenBrainz snapshot on the About page.
  # GitHub runs schedules when it has capacity and sometimes skips one, so hourly keeps a skipped run cheap.
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Builds that get published fetch the ListenBrainz snapshot (src/pages/listenbrainz.json.ts)
          LISTENBRAINZ_SNAPSHOT: ${{ github.ref == 'refs/heads/main' }}
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
