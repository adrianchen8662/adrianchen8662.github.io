name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  # Rebuild every 6 hours (00:23, 06:23, 12:23 and 18:23 UTC), which refreshes the ListenBrainz snapshot
  # on the About page. Kept infrequent on purpose: each run fetches the year's listens from ListenBrainz.
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only pushes to main, the schedule and manual runs on main publish the site; pull request checks only build it.
      # The event is checked as well as the branch: a check that starts after its PR was merged reports the ref as main.
      - run: npm run build
        env:
          # Builds that get published fetch the ListenBrainz snapshot (src/pages/listenbrainz.json.ts)
          LISTENBRAINZ_SNAPSHOT: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
